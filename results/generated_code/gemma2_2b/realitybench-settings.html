<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Settings</title>
  <style>
    body {
      font-family: sans-serif;
    }
    .container {
      width: 300px;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    label {
      display: block;
      margin-bottom: 5px;
    }
    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }
    input[type="checkbox"] {
      margin-bottom: 5px;
    }
    button {
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    .error {
      color: red;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>User Settings</h2>
    <form id="settingsForm">
      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" value="Your Name" required>
      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" value="" required>
      <label for="notifications">Email Notifications:</label>
      <input type="checkbox" id="notifications" name="notifications" checked>
      <span class="error" id="error"></span>
      <button type="submit">Save Changes</button>
      <button type="button" onclick="discardChanges()">Discard Changes</button>
    </form>
    <div id="successMessage"></div>
  </div>

  <script>
    const form = document.getElementById('settingsForm');
    const successMessage = document.getElementById('successMessage');
    const error = document.getElementById('error');
    const formSubmit = () => {
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const notifications = document.getElementById('notifications').checked;
      if (!name || !email) {
        error.textContent = 'Please fill in all fields.';
        return;
      }
      if (!validateEmail(email)) {
        error.textContent = 'Please enter a valid email address.';
        return;
      }
      const data = {
        name,
        email,
        notifications,
      };
      if (localStorage.getItem('settings')) {
        data.settings = JSON.parse(localStorage.getItem('settings'));
      }
      
      // Prevent duplicate requests
      if (data.settings) {
        if (data.settings.name !== name || data.settings.email !== email) {
          // Update the settings
          fetch('/api/settings', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(data),
          })
            .then((response) => {
              if (response.ok) {
                successMessage.textContent = 'Settings saved successfully.';
                localStorage.setItem('settings', JSON.stringify(data));
              } else {
                throw new Error('Failed to save settings.');
              }
            })
            .catch((error) => {
              error.textContent = 'Failed to save settings.';
            });
        }
      } else {
        // Save the settings
        fetch('/api/settings', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(data),
        })
          .then((response) => {
            if (response.ok) {
              successMessage.textContent = 'Settings saved successfully.';
              localStorage.setItem('settings', JSON.stringify(data));
            } else {
              throw new Error('Failed to save settings.');
            }
          })
          .catch((error) => {
            error.textContent = 'Failed to save settings.';
          });
      }
    };
    
    const discardChanges = () => {
      localStorage.clear();
      form.reset();
      successMessage.textContent = '';
    };

    form.addEventListener('submit', formSubmit);
    
    function validateEmail(email) {
      const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return re.test(email);
    }
  </script>
</body>
</html>
