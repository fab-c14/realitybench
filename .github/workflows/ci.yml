name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: |
          uv python install 3.11
          uv sync --all-extras
          uv run playwright install --with-deps chromium

      - name: Lint
        run: |
          uv run ruff check cli.py tests/ scripts/
          uv run pylint benchmark/ cli.py tests/

      - name: Test (includes grader calibration on all 12 tasks)
        run: uv run pytest -q
