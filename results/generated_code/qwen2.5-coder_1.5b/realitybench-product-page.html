<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Product Detail</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        .product-detail {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .product-image {
            max-width: 100%;
            height: auto;
            margin-bottom: 20px;
        }
        .variant-selector {
            margin-bottom: 10px;
        }
        .quantity-selector {
            margin-bottom: 10px;
        }
        .add-to-cart-button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .add-to-cart-button:hover {
            background-color: #0056b3;
        }
        .toast {
            position: fixed;
            top: 10px;
            right: 10px;
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            border-radius: 5px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="product-detail">
        <img src="https://via.placeholder.com/300" alt="Product Image" class="product-image">
        <h2>Product Title</h2>
        <p>$99.00</p>
        <div class="variant-selector">
            <label for="color">Color:</label>
            <select id="color" name="color">
                <option value="Midnight Blue">Midnight Blue</option>
                <option value="Lunar Silver" disabled>Out of Stock</option>
            </select>
        </div>
        <div class="quantity-selector">
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" min="1" max="10">
        </div>
        <button id="add-to-cart-button">Add to Cart</button>
        <div id="cart-feedback"></div>
    </div>

    <script>
        const addToCartButton = document.getElementById('add-to-cart-button');
        const quantityInput = document.getElementById('quantity');
        const cartFeedback = document.getElementById('cart-feedback');

        addToCartButton.addEventListener('click', async () => {
            const productId = 'PROD-101';
            const variant = document.getElementById('color').value;
            const quantity = parseInt(quantityInput.value, 10);

            if (isNaN(quantity) || quantity < 1 || quantity > 10) {
                alert('Please enter a valid quantity between 1 and 10.');
                return;
            }

            try {
                const response = await fetch('/api/cart', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ product_id: productId, variant: variant, quantity: quantity })
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.status === 'added') {
                        cartFeedback.textContent = `Added ${quantity} ${variant} to cart. Cart count: ${data.cart_count}`;
                        cartFeedback.style.display = 'block';
                        addToCartButton.disabled = true;
                        quantityInput.disabled = true;
                    } else {
                        alert('Failed to add to cart.');
                    }
                } else {
                    alert('Failed to add to cart.');
                }
            } catch (error) {
                console.error('Error adding to cart:', error);
                alert('Failed to add to cart.');
            }
        });

        // Prevent multiple cart additions on rapid button double-clicks
        addToCartButton.addEventListener('click', (event) => {
            event.preventDefault();
            setTimeout(() => {
                addToCartButton.disabled = false;
                quantityInput.disabled = false;
            }, 1000);
        });
    </script>
</body>
</html>
