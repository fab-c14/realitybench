<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <style>
    body {
      font-family: sans-serif;
    }
    label {
      display: block;
      margin-bottom: 5px;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    button {
      padding: 10px 20px;
      background-color: #007bff;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    .success {
      color: green;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Login</h1>
  <form id="loginForm">
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>
    <button type="submit">Login</button>
  </form>
  <div class="success" id="successMessage"></div>
  <script>
    const form = document.getElementById('loginForm');
    const successMessage = document.getElementById('successMessage');

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Basic validation (you can add more complex validation)
      if (!email || !password) {
        successMessage.textContent = 'Please fill in all fields.';
        return;
      }

      // AJAX request
      fetch('/api/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ email, password })
      })
      .then(response => response.json())
      .then(data => {
        if (data.token && data.user) {
          successMessage.textContent = 'Welcome, ' + data.user.name + '!';
          // Store token for future use (e.g., in local storage)
        } else {
          successMessage.textContent = 'Login failed. Please check your credentials.';
        }
      })
      .catch(error => {
        successMessage.textContent = 'An error occurred. Please try again later.';
      });
    });
  </script>
</body>
</html>
