<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Detail</title>
    <style>
        body {
            font-family: sans-serif;
        }

        .product-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px;
        }

        .product-image {
            width: 200px;
            height: 200px;
            object-fit: cover;
            margin-bottom: 20px;
        }

        .product-info {
            margin-bottom: 20px;
        }

        .variant-selector {
            margin-bottom: 10px;
        }

        .quantity-selector {
            margin-bottom: 10px;
        }

        .add-to-cart {
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .cart-feedback {
            margin-top: 20px;
            padding: 10px;
            background-color: #f2f2f2;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="product-container">
        <img src="placeholder.jpg" alt="Product Image" class="product-image">
        <div class="product-info">
            <h2>Product Title</h2>
            <p><strong>Price:</strong> $99.00</p>
        </div>
    </div>

    <div class="variant-selector">
        <select id="variant-select">
            <option value="Midnight Blue">Midnight Blue</option>
            <option value="Lunar Silver">Lunar Silver</option>
        </select>
    </div>

    <div class="quantity-selector">
        <input type="number" min="1" max="10" id="quantity-input" value="1">
    </div>

    <button class="add-to-cart" onclick="addToCart()">Add to Cart</button>

    <div class="cart-feedback" id="cart-feedback"></div>

    <script>
        const addToCartButton = document.querySelector('.add-to-cart');
        const cartFeedback = document.getElementById('cart-feedback');
        const variantSelect = document.getElementById('variant-select');
        const quantityInput = document.getElementById('quantity-input');

        function addToCart() {
            const variant = variantSelect.value;
            const quantity = parseInt(quantityInput.value);

            if (variant === '' || quantity <= 0) {
                alert('Please select a variant and enter a valid quantity.');
                return;
            }

            if (variant === 'Lunar Silver' && quantity > 0) {
                addToCartRequest(variant, quantity);
            } else {
                addToCartRequest(variant, quantity);
            }
        }

        function addToCartRequest(variant, quantity) {
            // Send POST request to '/api/cart'
            fetch('/api/cart', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    'product_id': 'PROD-101',
                    'variant': variant,
                    'quantity': quantity
                })
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    throw new Error('Failed to add to cart');
                }
            })
            .then(data => {
                if (data.status === 'added') {
                    cartFeedback.innerHTML = `
                        <p>Product added to cart!</p>
                    `;
                    setTimeout(() => {
                        cartFeedback.innerHTML = '';
                    }, 2000);
                }
            })
            .catch(error => {
                console.error('Error adding to cart:', error);
                alert('Failed to add to cart.');
            });
        }
    </script>
</body>
</html>
