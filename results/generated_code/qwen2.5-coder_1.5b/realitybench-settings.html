<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Settings</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .settings-container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .form-group input[type="checkbox"], .form-group select {
            margin-top: 5px;
        }
        .form-group button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .form-group button:hover {
            background-color: #0056b3;
        }
        .notification {
            margin-top: 10px;
            color: green;
        }
        .error {
            margin-top: 10px;
            color: red;
        }
    </style>
</head>
<body>
    <div class="settings-container">
        <h2>User Settings</h2>
        <form id="settingsForm">
            <div class="form-group">
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="notifications">Notification Preference:</label>
                <input type="checkbox" id="notifications" name="notifications">
            </div>
            <div class="form-group">
                <button type="submit">Save Changes</button>
                <button type="button" onclick="discardChanges()">Discard Changes</button>
            </div>
        </form>
        <div class="notification"></div>
        <div class="error"></div>
    </div>

    <script>
        const form = document.getElementById('settingsForm');
        const fullNameInput = document.getElementById('fullName');
        const emailInput = document.getElementById('email');
        const notificationsCheckbox = document.getElementById('notifications');
        const notificationElement = document.querySelector('.notification');
        const errorElement = document.querySelector('.error');

        let lastSavedSettings = {};

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const settings = Object.fromEntries(formData.entries());

            if (!settings.name) {
                errorElement.textContent = 'Name is required.';
                return;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(settings.email)) {
                errorElement.textContent = 'Invalid email address.';
                return;
            }

            try {
                const response = await fetch('/api/settings', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(settings)
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.status === 'saved') {
                        notificationElement.textContent = 'Settings saved successfully.';
                        lastSavedSettings = settings;
                    } else {
                        errorElement.textContent = 'Failed to save settings.';
                    }
                } else {
                    errorElement.textContent = 'Failed to save settings.';
                }
            } catch (error) {
                errorElement.textContent = 'An error occurred while saving settings.';
            }
        });

        function discardChanges() {
            notificationElement.textContent = '';
            errorElement.textContent = '';
            form.reset();
            lastSavedSettings = {};
        }
    </script>
</body>
</html>
