<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Interface</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chat-container {
            width: 300px;
            height: 400px;
            border: 1px solid #ccc;
            overflow-y: auto;
            padding: 10px;
        }
        .message {
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            background-color: #f0f0f0;
        }
        .message.bot {
            background-color: #e0e0e0;
        }
        .input-container {
            margin-top: 10px;
        }
        .input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .send-button {
            width: 100px;
            padding: 10px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        .send-button:hover {
            background-color: #0056b3;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="chat-container" id="chat-container"></div>
    <div class="input-container">
        <input type="text" class="input" id="message-input" placeholder="Type your message...">
        <button class="send-button" id="send-button">Send</button>
    </div>
    <div class="error" id="error"></div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const error = document.getElementById('error');

        sendButton.addEventListener('click', async () => {
            const message = messageInput.value.trim();
            if (message === '') {
                error.textContent = 'Message cannot be empty';
                return;
            }

            if (message === messageInput.value) {
                error.textContent = 'Duplicate message detected';
                return;
            }

            messageInput.value = '';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                const messageElement = document.createElement('div');
                messageElement.textContent = `You: ${message}`;
                messageElement.classList.add('message');
                chatContainer.appendChild(messageElement);

                const botReplyElement = document.createElement('div');
                botReplyElement.textContent = `Bot: ${data.reply}`;
                botReplyElement.classList.add('message', 'bot');
                chatContainer.appendChild(botReplyElement);

                chatContainer.scrollTop = chatContainer.scrollHeight;
            } catch (error) {
                error.textContent = 'Error sending message';
            }
        });

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendButton.click();
            }
        });
    </script>
</body>
</html>
