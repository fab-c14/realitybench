<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .upload-container {
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .upload-container h2 {
            margin-bottom: 20px;
        }
        .upload-container input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .upload-container button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .upload-container button:hover {
            background-color: #0056b3;
        }
        .upload-container .status {
            margin-top: 20px;
            color: green;
        }
        .upload-container .error {
            margin-top: 20px;
            color: red;
        }
    </style>
</head>
<body>
    <div class="upload-container">
        <h2>Upload a File</h2>
        <input type="file" id="fileInput" accept=".pdf,.png,.jpg" max="5MB">
        <button id="uploadButton">Upload</button>
        <div class="status"></div>
        <div class="error"></div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadButton = document.getElementById('uploadButton');
        const status = document.querySelector('.status');
        const error = document.querySelector('.error');

        uploadButton.addEventListener('click', async () => {
            if (!fileInput.files || fileInput.files.length === 0) {
                error.textContent = 'Please select a file.';
                return;
            }

            const file = fileInput.files[0];
            if (file.size > 5 * 1024 * 1024) {
                error.textContent = 'File size exceeds 5MB.';
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    status.textContent = `File uploaded successfully: ${data.filename}`;
                } else {
                    error.textContent = `Upload failed: ${response.statusText}`;
                }
            } catch (error) {
                error.textContent = `An error occurred: ${error.message}`;
            }
        });
    </script>
</body>
</html>
