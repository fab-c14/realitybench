<!DOCTYPE html>
<html>
<head>
  <title>Onboarding Wizard</title>
  <style>
    body {
      font-family: sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 400px;
      margin: 0 auto;
    }

    .step {
      margin-bottom: 20px;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .step-title {
      font-size: 1.2em;
      margin-bottom: 10px;
    }

    .input-group {
      display: flex;
      align-items: center;
    }

    .input-group input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      width: 200px;
    }

    .input-group button {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
    }

    .step-indicator {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2em;
    }

    .step-indicator span {
      margin-right: 10px;
    }

    .submit-button {
      padding: 10px 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="step step-1">
      <div class="step-title">Account Information</div>
      <div class="input-group">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name">
      </div>
      <div class="input-group">
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email">
      </div>
      <button type="button" id="next-button">Next</button>
    </div>
    <div class="step step-2">
      <div class="step-title">Subscription Plan</div>
      <div class="input-group">
        <label for="plan">Plan:</label>
        <select id="plan">
          <option value="Starter">Starter</option>
          <option value="Professional">Professional</option>
          <option value="Enterprise">Enterprise</option>
        </select>
      </div>
      <button type="button" id="back-button">Back</button>
      <button type="button" id="next-button">Next</button>
    </div>
    <div class="step step-3">
      <div class="step-title">Review & Confirmation</div>
      <div id="summary"></div>
      <div class="input-group">
        <input type="checkbox" id="terms" name="terms">
        <label for="terms">I accept the terms and conditions</label>
      </div>
      <button type="button" id="back-button">Back</button>
      <button type="button" id="submit-button">Submit Order</button>
    </div>
  </div>
  <script>
    const nextButton = document.getElementById('next-button');
    const backButton = document.getElementById('back-button');
    const submitButton = document.getElementById('submit-button');
    const summary = document.getElementById('summary');
    const plan = document.getElementById('plan');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');

    nextButton.addEventListener('click', () => {
      if (nameInput.value === '' || emailInput.value === '') {
        alert('Please fill in all fields.');
        return;
      }
      // ... (Your logic to proceed to Step 2)
    });

    backButton.addEventListener('click', () => {
      // ... (Your logic to go back to previous step)
    });

    submitButton.addEventListener('click', () => {
      if (nameInput.value === '' || emailInput.value === '') {
        alert('Please fill in all fields.');
        return;
      }
      // ... (Your logic to submit data)
    });
  </script>
</body>
</html>
