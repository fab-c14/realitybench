[project]
name = "realitybench"
version = "0.1.0"
description = "Grade AI-generated web apps in a real browser under real-user conditions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Fab-c", email = "71762204+fab-c14@users.noreply.github.com" }
]
dependencies = [
    "kaggle-benchmarks>=0.6.0",
    "kaggle>=2.2.0",
    "playwright>=1.40.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "pylint>=3.1.0",
]

[project.scripts]
realitybench = "cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "benchmark",
    "cli.py",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.main]
py-version = "3.11"
ignore = [".venv", "results", "build", "dist"]
jobs = 0

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "x", "y", "ax", "bar", "f", "e", "t", "s", "w", "h"]

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "line-too-long",
    "too-many-arguments",
    "too-many-locals",
    "too-many-statements",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-positional-arguments",
    "too-few-public-methods",
    "fixme",
    "invalid-name",
    "duplicate-code",
    "broad-exception-caught",
    "wrong-import-position",
    "wrong-import-order",
    "import-outside-toplevel",
    "redefined-outer-name",
    "global-statement",
    "disallowed-name",
    "superfluous-parens",
    "unused-argument",
    "trailing-whitespace",
    "consider-using-dict-items",
    "too-many-lines",
]

[tool.pylint.format]
max-line-length = 120

