<!DOCTYPE html>
<html>
<head>
  <title>File Upload</title>
  <style>
    #dropzone {
      width: 300px;
      height: 200px;
      border: 2px dashed #ccc;
      padding: 20px;
      text-align: center;
    }
    #upload-button {
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    #status {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #ccc;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>File Upload</h1>
  <div id="dropzone">
    <p>Drag and drop a file here, or click to select one.</p>
  </div>
  <input type="file" id="fileInput" accept="application/pdf,image/png,image/jpeg" />
  <button id="upload-button">Upload</button>
  <div id="status"></div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const uploadButton = document.getElementById('upload-button');
    const status = document.getElementById('status');

    const MAX_FILE_SIZE = 5 * 1024 * 1024; // 5MB

    uploadButton.addEventListener('click', () => {
      if (!fileInput.files.length) return; // No file selected

      const file = fileInput.files[0];
      if (!file || file.type.match(/^(image\/png|image\/jpeg|application\/pdf)$/) === null || file.size > MAX_FILE_SIZE) {
        status.textContent = 'Please select a valid file (PDF, PNG, JPG) and keep it under 5MB.';
        return;
      }

      const formData = new FormData();
      formData.append('file', file);

      // Send the file to the server
      fetch('/api/upload', {
        method: 'POST',
        body: formData
      })
      .then(response => {
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        return response.json();
      })
      .then(data => {
        if (data.status === 'success') {
          status.textContent = `File uploaded successfully: ${data.filename}`;
          // Display the uploaded file
        } else {
          status.textContent = `Error: ${data.message}`;
        }
      })
      .catch(error => {
        status.textContent = `Error: ${error.message}`;
      });
    });

    dropzone.addEventListener('dragover', (event) => {
      event.preventDefault();
    });

    dropzone.addEventListener('drop', (event) => {
      event.preventDefault();
      const file = event.dataTransfer.files[0];
      if (!file || file.type.match(/^(image\/png|image\/jpeg|application\/pdf)$/) === null) {
        status.textContent = 'Please select a valid file (PDF, PNG, JPG).';
        return;
      }
      fileInput.value = '';
      const formData = new FormData();
      formData.append('file', file);
      // Send the file to the server
      fetch('/api/upload', {
        method: 'POST',
        body: formData
      })
      .then(response => {
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        return response.json();
      })
      .then(data => {
        if (data.status === 'success') {
          status.textContent = `File uploaded successfully: ${data.filename}`;
          // Display the uploaded file
        } else {
          status.textContent = `Error: ${data.message}`;
        }
      })
      .catch(error => {
        status.textContent = `Error: ${error.message}`;
      });
    });
  </script>
</body>
</html>
