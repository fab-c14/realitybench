<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout Interface</title>
<style>
  body { font-family: Arial, sans-serif; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; margin-bottom: 5px; }
  .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
  .form-group button { padding: 10px 20px; background-color: #4CAF50; color: white; border: none; cursor: pointer; }
  .form-group button:hover { background-color: #45a049; }
  .order-summary { margin-top: 20px; }
  .order-summary p { margin: 5px 0; }
  .order-summary .total { font-weight: bold; }
  .order-summary .error { color: red; }
</style>
</head>
<body>
<div class="form-group">
  <label for="name">Full Name</label>
  <input type="text" id="name" required>
</div>
<div class="form-group">
  <label for="email">Email Address</label>
  <input type="email" id="email" required>
</div>
<div class="form-group">
  <label for="address">Shipping Address</label>
  <input type="text" id="address" required>
</div>
<div class="form-group">
  <label for="amount">Amount</label>
  <input type="text" id="amount" value="49.00" readonly>
</div>
<div class="form-group">
  <button id="submitBtn">Pay & Place Order</button>
</div>
<div class="order-summary" id="orderSummary">
  <p>Item: $49.00</p>
  <p class="total">Total: $49.00</p>
  <p class="error"></p>
</div>

<script>
  let isSubmitting = false;

  document.getElementById('submitBtn').addEventListener('click', function() {
    if (isSubmitting) return;

    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const address = document.getElementById('address').value;
    const amount = document.getElementById('amount').value;

    if (!name || !email || !address) {
      document.getElementById('orderSummary').querySelector('.error').textContent = 'All fields are required.';
      return;
    }

    isSubmitting = true;

    fetch('/api/checkout', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ name, email, address, amount })
    })
    .then(response => response.json())
    .then(data => {
      if (data.status === 'confirmed') {
        document.getElementById('orderSummary').innerHTML = `
          <p>Order Confirmed!</p>
          <p>Order ID: ${data.order_id}</p>
        `;
      } else {
        document.getElementById('orderSummary').querySelector('.error').textContent = 'Failed to place order.';
      }
    })
    .catch(error => {
      document.getElementById('orderSummary').querySelector('.error').textContent = 'An error occurred. Please try again later.';
    })
    .finally(() => {
      isSubmitting = false;
    });
  });
</script>
</body>
</html>
