[project]
name = "realitybench"
version = "0.1.0"
description = "Benchmarking AI-Generated Software Beyond the Happy Path"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Fab-c", email = "71762204+fab-c14@users.noreply.github.com" }
]
dependencies = [
    "kaggle-benchmarks>=0.6.0",
    "playwright>=1.40.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "orjson>=3.9.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "axe-playwright-python>=0.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "pyright>=1.1.350",
]

[project.scripts]
realitybench = "cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "benchmark",
    "ui",
    "analysis",
    "cli.py",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
