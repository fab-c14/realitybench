<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .task-list {
            list-style-type: none;
            padding: 0;
        }
        .task-list li {
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .task-list li .delete-btn {
            color: red;
            cursor: pointer;
        }
        .empty-state {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Task Management Dashboard</h1>
        <input type="text" id="taskInput" placeholder="Enter new task">
        <button id="addTaskBtn">Add Task</button>
        <div class="task-list" id="taskList"></div>
        <div class="empty-state" id="emptyState" style="display: none;">
            No tasks yet
        </div>
    </div>

    <script>
        const taskListContainer = document.getElementById('taskList');
        const emptyState = document.getElementById('emptyState');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const taskInput = document.getElementById('taskInput');

        // Fetch initial tasks
        fetch('/api/tasks')
            .then(response => response.json())
            .then(data => {
                data.tasks.forEach(task => {
                    const li = document.createElement('li');
                    li.textContent = task.title;
                    li.appendChild(createDeleteButton(task.id));
                    taskListContainer.appendChild(li);
                });
            })
            .catch(error => {
                console.error('Error fetching tasks:', error);
            });

        addTaskBtn.addEventListener('click', () => {
            const taskTitle = taskInput.value.trim();
            if (taskTitle === '') {
                alert('Please enter a task title.');
                return;
            }

            fetch('/api/tasks', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ title: taskTitle })
            })
            .then(response => response.json())
            .then(data => {
                const li = document.createElement('li');
                li.textContent = data.title;
                li.appendChild(createDeleteButton(data.id));
                taskListContainer.appendChild(li);
                taskInput.value = '';
            })
            .catch(error => {
                console.error('Error adding task:', error);
            });
        });

        taskListContainer.addEventListener('click', (event) => {
            if (event.target.classList.contains('delete-btn')) {
                const taskId = event.target.parentElement.getAttribute('data-id');
                const confirmDelete = confirm('Are you sure you want to delete this task?');

                if (confirmDelete) {
                    fetch(`/api/tasks/${taskId}`, {
                        method: 'DELETE'
                    })
                    .then(response => response.json())
                    .then(data => {
                        const li = event.target.parentElement;
                        li.remove();
                        if (taskListContainer.children.length === 0) {
                            emptyState.style.display = 'block';
                        }
                    })
                    .catch(error => {
                        console.error('Error deleting task:', error);
                    });
                }
            }
        });

        function createDeleteButton(taskId) {
            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = 'Delete';
            deleteBtn.classList.add('delete-btn');
            deleteBtn.setAttribute('data-id', taskId);
            return deleteBtn;
        }
    </script>
</body>
</html>
