<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding Workflow Wizard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .wizard-container {
            width: 300px;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .step {
            margin-bottom: 20px;
        }
        .step h2 {
            margin-bottom: 10px;
        }
        .step input, .step select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .step button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .step button:hover {
            background-color: #0056b3;
        }
        .step.error {
            border-color: red;
        }
        .step.error input, .step.error select {
            border-color: red;
        }
        .step.error button {
            background-color: #dc3545;
        }
        .step.error button:hover {
            background-color: #c82333;
        }
        .order-completion {
            margin-top: 20px;
            text-align: center;
        }
        .order-completion h2 {
            margin-bottom: 10px;
        }
        .order-completion p {
            margin-bottom: 20px;
        }
        .order-completion button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .order-completion button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="wizard-container">
        <div class="step">
            <h2>Step 1: Account Information</h2>
            <input type="text" id="fullName" placeholder="Full Name">
            <input type="email" id="email" placeholder="Email Address">
            <button id="nextStep1">Next</button>
        </div>
        <div class="step" id="step2" style="display: none;">
            <h2>Step 2: Subscription Plan</h2>
            <select id="plan">
                <option value="starter">Starter</option>
                <option value="professional">Professional</option>
                <option value="enterprise">Enterprise</option>
            </select>
            <button id="backStep2">Back</button>
            <button id="nextStep2">Next</button>
        </div>
        <div class="step" id="step3" style="display: none;">
            <h2>Step 3: Review & Confirmation</h2>
            <div id="summary"></div>
            <input type="checkbox" id="terms" required>
            <label for="terms">I accept the terms and conditions</label>
            <button id="backStep3">Back</button>
            <button id="submitOrder">Submit Order</button>
        </div>
        <div class="order-completion" id="orderCompletion" style="display: none;">
            <h2>Order Completion</h2>
            <p>Your order has been completed. Order ID: <span id="orderId"></span></p>
            <button id="closeOrderCompletion">Close</button>
        </div>
    </div>

    <script>
        document.getElementById('nextStep1').addEventListener('click', function() {
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            if (!fullName || !email) {
                alert('Please fill in all fields.');
                return;
            }
            document.getElementById('step2').style.display = 'block';
        });

        document.getElementById('backStep1').addEventListener('click', function() {
            document.getElementById('step1').style.display = 'block';
            document.getElementById('step2').style.display = 'none';
        });

        document.getElementById('nextStep2').addEventListener('click', function() {
            const plan = document.getElementById('plan').value;
            if (!plan) {
                alert('Please select a plan.');
                return;
            }
            document.getElementById('step3').style.display = 'block';
        });

        document.getElementById('backStep2').addEventListener('click', function() {
            document.getElementById('step2').style.display = 'block';
            document.getElementById('step3').style.display = 'none';
        });

        document.getElementById('submitOrder').addEventListener('click', function() {
            const name = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const plan = document.getElementById('plan').value;
            const terms = document.getElementById('terms').checked;

            if (!terms) {
                alert('Please accept the terms and conditions.');
                return;
            }

            fetch('/api/workflow/complete', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name, email, plan, terms })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'completed') {
                    document.getElementById('step3').style.display = 'none';
                    document.getElementById('orderCompletion').style.display = 'block';
                    document.getElementById('orderId').textContent = data.order_id;
                } else {
                    alert('Order submission failed.');
                    document.getElementById('step3').style.display = 'block';
                }
            })
            .catch(error => {
                alert('An error occurred while submitting the order.');
                document.getElementById('step3').style.display = 'block';
            });
        });

        document.getElementById('closeOrderCompletion').addEventListener('click', function() {
            document.getElementById('orderCompletion').style.display = 'none';
        });
    </script>
</body>
</html>
