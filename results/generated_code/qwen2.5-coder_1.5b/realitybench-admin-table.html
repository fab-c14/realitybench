<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        .user-table-container {
            width: 80%;
            max-width: 1200px;
            overflow-x: auto;
        }
        .user-table {
            width: 100%;
            border-collapse: collapse;
        }
        .user-table th, .user-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        .user-table th {
            background-color: #f2f2f2;
        }
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .pagination button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .pagination button.active {
            background-color: #4CAF50;
            color: white;
        }
        .pagination button.disabled {
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="user-table-container">
        <table class="user-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Role</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="user-table-body"></tbody>
        </table>
        <div class="pagination">
            <button class="pagination-button" disabled>Previous</button>
            <button class="pagination-button" disabled>1</button>
            <button class="pagination-button" disabled>2</button>
            <button class="pagination-button" disabled>3</button>
            <button class="pagination-button" disabled>Next</button>
        </div>
    </div>

    <script>
        const API_URL = '/api/users';
        const PAGE_SIZE = 5;
        let currentPage = 1;
        let totalUsers = 0;
        let totalPages = 0;

        async function fetchData() {
            const response = await fetch(`${API_URL}?page=${currentPage}&limit=${PAGE_SIZE}`);
            const data = await response.json();
            totalUsers = data.total;
            totalPages = Math.ceil(totalUsers / PAGE_SIZE);
            displayUsers(data.users);
        }

        function displayUsers(users) {
            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = '';

            users.forEach(user => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${user.id}</td>
                    <td>${user.name}</td>
                    <td>${user.role}</td>
                    <td>${user.status}</td>
                `;
                tbody.appendChild(row);
            });

            updatePagination();
        }

        function updatePagination() {
            const pagination = document.querySelector('.pagination');
            pagination.innerHTML = '';

            const buttons = [];
            for (let i = 1; i <= totalPages; i++) {
                const button = document.createElement('button');
                button.textContent = i;
                button.addEventListener('click', () => {
                    currentPage = i;
                    fetchData();
                });
                buttons.push(button);
            }

            buttons.forEach(button => {
                pagination.appendChild(button);
            });

            if (currentPage === 1) {
                buttons[0].classList.add('active');
            } else if (currentPage === totalPages) {
                buttons[totalPages - 1].classList.add('active');
            }
        }

        document.addEventListener('DOMContentLoaded', fetchData);
    </script>
</body>
</html>
